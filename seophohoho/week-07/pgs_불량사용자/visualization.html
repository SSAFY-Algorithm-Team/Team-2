<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>불량 사용자 — 백트래킹 + list 중복 제거 시각화</title>
<style>
  :root{
    --text-primary:#1a1a1a; --text-secondary:#6b6b6b; --text-accent:#2563eb;
    --surface-0:#ffffff; --surface-1:#f4f4f5; --surface-2:#e4e4e7;
    --border-strong:#d4d4d8; --radius:8px;
    --green-bg:#eaf3de; --green-fg:#3b6d11; --green-border:#97c459;
    --red-bg:#fdecea; --red-fg:#a12a2a; --red-border:#e58080;
    --gray-bg:#f0f0f2; --gray-fg:#444; --gray-border:#c4c4c8;
    --amber-bg:#fdf3d8; --amber-fg:#8a5a00; --amber-border:#e0b64a;
    --code-bg:#f6f6f7; --code-fg:#333; --code-num:#a0a0a4;
    --code-hl-bg:#dbe8fd; --code-hl-border:#2563eb;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --text-primary:#f0f0f0; --text-secondary:#a0a0a0; --text-accent:#7aa2ff;
      --surface-0:#161618; --surface-1:#1f1f22; --surface-2:#2a2a2e;
      --border-strong:#3a3a3e;
      --green-bg:#173404; --green-fg:#c0dd97; --green-border:#3b6d11;
      --red-bg:#3a1414; --red-fg:#f2a6a6; --red-border:#8a2a2a;
      --gray-bg:#232326; --gray-fg:#c8c8c8; --gray-border:#444;
      --amber-bg:#3a2c05; --amber-fg:#f0cf7a; --amber-border:#8a6a10;
      --code-bg:#1c1c1f; --code-fg:#dcdcdc; --code-num:#5c5c60;
      --code-hl-bg:#23324f; --code-hl-border:#7aa2ff;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--surface-0);color:var(--text-primary);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding:16px}
  .wrap{max-width:1080px;margin:0 auto;font-size:14px}
  h1{font-size:18px;font-weight:500;margin:0 0 12px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .bar button{font:inherit;padding:6px 12px;border-radius:var(--radius);
              border:0.5px solid var(--border-strong);background:var(--surface-1);
              color:var(--text-primary);cursor:pointer}
  .bar button.on{border-color:var(--text-accent);color:var(--text-accent)}
  .bar .sp{flex:1}
  .cnt{color:var(--text-secondary);font-size:13px}
  .layout{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
  .left{flex:1 1 320px;min-width:280px}
  .right{flex:1 1 520px;min-width:440px;position:sticky;top:16px}
  .msg{min-height:52px;padding:10px 12px;border-radius:12px;background:var(--surface-1);
       margin-bottom:10px;line-height:1.6}
  .info{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--text-secondary);
        margin-bottom:8px}
  .info b{font-weight:500;color:var(--text-primary);font-family:ui-monospace,Menlo,monospace}
  .rlist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .rlist .item{padding:4px 8px;border-radius:8px;background:var(--surface-1);
               border:0.5px solid var(--border-strong);
               font-family:ui-monospace,Menlo,monospace;font-size:12px;transition:all .3s}
  .rlist .item.checking{border-color:var(--text-accent);color:var(--text-accent)}
  .rlist .item.new{border-color:var(--text-accent);background:var(--surface-2)}
  svg{display:block}
  svg .n{opacity:0;transition:opacity .45s}
  svg .n.show{opacity:1}
  svg .e{opacity:0;transition:opacity .45s}
  svg .e.show{opacity:1}
  svg .cur rect{stroke:var(--text-primary)!important;stroke-width:2!important}
  svg text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  svg text.th{font-size:14px;font-weight:500;fill:var(--text-primary)}
  svg text.ts{font-size:12px;fill:var(--text-secondary)}
  svg rect{stroke-width:1}
  .c-green rect{fill:var(--green-bg);stroke:var(--green-border)}
  .c-green text.th{fill:var(--green-fg)}
  .c-red rect{fill:var(--red-bg);stroke:var(--red-border)}
  .c-red text.th{fill:var(--red-fg)}
  .c-gray rect{fill:var(--gray-bg);stroke:var(--gray-border)}
  .c-gray text.th{fill:var(--gray-fg)}
  .c-amber rect{fill:var(--amber-bg);stroke:var(--amber-border)}
  .c-amber text.th{fill:var(--amber-fg)}
  .code{background:var(--code-bg);border:0.5px solid var(--border-strong);
        border-radius:12px;padding:10px 0;font-family:ui-monospace,Menlo,monospace;
        font-size:12.5px;line-height:1.65;overflow-x:auto}
  .code .ln{display:flex;padding:0 12px;white-space:pre;border-left:3px solid transparent;
            transition:background .3s,border-color .3s}
  .code .ln .no{color:var(--code-num);width:22px;flex:0 0 auto;user-select:none;text-align:right;margin-right:10px}
  .code .ln .tx{color:var(--code-fg);white-space:pre}
  .code .ln.hl{background:var(--code-hl-bg);border-left-color:var(--code-hl-border)}
  .code .ln.hl .tx{color:var(--text-primary);font-weight:500}
  .code .ln.blank{height:6px}
  footer{margin-top:14px;font-size:12px;color:var(--text-secondary)}
  @media (max-width:680px){.right{position:static}}
</style>
</head>
<body>
<div class="wrap">
<h1>불량 사용자 — list + set 값비교로 중복을 거르는 백트래킹</h1>
<div class="bar">
<button id="t1" class="on">예제 1</button><button id="t2">예제 2</button>
<span class="sp"></span>
<button id="rs">⏮ 처음</button><button id="pv">◀ 이전</button><button id="pl">▶ 자동</button><button id="nx">다음 ▶</button>
</div>
<div class="layout">
<div class="left">
<div class="msg" id="msg"></div>
<div class="info"><span>picked: <b id="pk"></b></span><span>result 스캔: <b id="scanw"></b></span><span class="cnt" id="cnt"></span></div>
<div class="rlist" id="rlist"></div>
<svg id="sv" width="100%" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
<div class="right">
<div class="code" id="code"></div>
</div>
</div>
<footer>코드: dfs가 depth == len(banned_id)에 닿으면 picked_set을 만들고, result 리스트를 선형 탐색해 같은 set이 없을 때만 append한다. 오른쪽 코드 패널의 강조된 줄이 지금 애니메이션 단계가 실행 중인 지점이다.</footer>
</div>
<script>
const CODE = [
"def check(user, pattern):",
"    if len(user) != len(pattern):",
"        return False",
"    for i in range(len(user)):",
"        if pattern[i] != '*' and user[i] != pattern[i]:",
"            return False",
"    return True",
"",
"def dfs(depth, user_id, banned_id, picked, result):",
"    if depth == len(banned_id):",
"        picked_set = set(picked)",
"        if picked_set not in result:",
"            result.append(picked_set)",
"        return",
"    for user in user_id:",
"        if user in picked or not check(user, banned_id[depth]):",
"            continue",
"        picked.append(user)",
"        dfs(depth + 1, user_id, banned_id, picked, result)",
"        picked.pop()",
"",
"def solution(user_id, banned_id):",
"    result = []",
"    dfs(0, user_id, banned_id, [], result)",
"    return len(result)"
];
// line numbers are 1-indexed matching CODE array (CODE[0] = line 1)
const EX={

['d',[],['{frodo, abc123}','{fradi, abc123}'],null,[16,17],'abc123은 길이가 달라 컷.'],
['e',[],['{frodo, abc123}','{fradi, abc123}'],null,[15,25],'frodoc도 길이가 달라 컷. 1번 칸 for가 끝나 dfs·solution이 모두 반환된다. <b>25행</b> return len(result) = 2.']]},
2:{h:500,nodes:[
['root',370,20,240,'시작','1번 칸 *rodo','c-gray'],

['b11',530,360,190,'crodo·abc123 등','재탐색','c-amber']],

steps:[
['root',[],[],null,[15,16],'1번 칸 <b>*rodo</b>에 넣을 사람을 본다.'],
['a',['frodo'],[],null,[16,18,19],'frodo가 맞는다. <b>18~19행</b>으로 뽑고 2번 칸 *rodo로 내려간다.'],
['a1',['frodo'],[],null,[16,17],'frodo는 <b>16행</b> user in picked라서 컷. fradi는 패턴이 안 맞아 컷.'],

};
let ex=1,i=0,timer=null;
const sv=document.getElementById('sv');
const codeEl=document.getElementById('code');
function buildCode(){
  codeEl.innerHTML = CODE.map((line,idx)=>{
    if(line===''){return `<div class="ln blank" data-line="${idx+1}"></div>`;}
    const esc = line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<div class="ln" data-line="${idx+1}"><span class="no">${idx+1}</span><span class="tx">${esc}</span></div>`;
  }).join('');
}
function highlightCode(lines){
  codeEl.querySelectorAll('.ln').forEach(el=>{
    const n = Number(el.dataset.line);
    el.classList.toggle('hl', lines.includes(n));
  });
  const first = codeEl.querySelector('.ln.hl');
  if(first) first.scrollIntoView({block:'nearest'});
}
function build(){
 const E=EX[ex],pos={};
 E.nodes.forEach(n=>{const h=n[5]?52:44;pos[n[0]]={x:n[1],top:n[2],bot:n[2]+h}});
 let s='';
 E.edges.forEach(([f,t])=>{const a=pos[f],b=pos[t];s+=`<line class="e" data-t="${t}" x1="${a.x}" y1="${a.bot}" x2="${b.x}" y2="${b.top}" stroke="currentColor" stroke-width="0.5" style="color:var(--border-strong)"/>`});
 E.nodes.forEach(([id,x,y,w,t,sub,c])=>{const h=sub?52:44;s+=`<g class="n ${c}" id="n_${id}"><rect x="${x-w/2}" y="${y}" width="${w}" height="${h}" rx="4"/>`+(sub?`<text class="th" x="${x}" y="${y+22}" text-anchor="middle">${t}</text><text class="ts" x="${x}" y="${y+41}" text-anchor="middle">${sub}</text>`:`<text class="th" x="${x}" y="${y+27}" text-anchor="middle">${t}</text>`)+'</g>'});
 sv.setAttribute('viewBox',`0 0 740 ${E.h}`);sv.innerHTML=s;
}
function render(){
 const E=EX[ex],st=E.steps,cur=st[i];
 const [id,picked,result,tag,lines,msg]=cur;
 const shown=new Set(st.slice(0,i+1).map(x=>x[0]));
 E.nodes.forEach(n=>{const g=document.getElementById('n_'+n[0]);g.classList.toggle('show',shown.has(n[0]));g.classList.toggle('cur',n[0]===id)});
 sv.querySelectorAll('.e').forEach(l=>l.classList.toggle('show',shown.has(l.dataset.t)));
 document.getElementById('pk').textContent='['+picked.join(', ')+']';
 document.getElementById('scanw').textContent=tag&&tag.startsWith('scan')?'진행 중':'대기';
 document.getElementById('msg').innerHTML=msg;
 document.getElementById('cnt').textContent=`${i+1} / ${st.length}`;
 const rl=document.getElementById('rlist');
 rl.innerHTML=result.map((v)=>{
   let cls='item';
   if(tag&&tag.startsWith('scan')) cls+=' checking';
   return `<span class="${cls}">${v}</span>`;
 }).join('')||'<span style="color:var(--text-secondary);font-size:12px">비어 있음</span>';
 if(tag==='new'){
   const items=rl.querySelectorAll('.item');
   if(items.length) items[items.length-1].classList.add('new');
 }
 highlightCode(lines||[]);
}
function stop(){clearInterval(timer);timer=null;document.getElementById('pl').textContent='▶ 자동'}
function go(d){const n=EX[ex].steps.length;i=Math.max(0,Math.min(n-1,i+d));render();if(i===n-1)stop()}
document.getElementById('nx').onclick=()=>{stop();go(1)};
document.getElementById('pv').onclick=()=>{stop();go(-1)};
document.getElementById('rs').onclick=()=>{stop();i=0;render()};
document.getElementById('pl').onclick=()=>{if(timer){stop();return}if(i===EX[ex].steps.length-1)i=0;render();timer=setInterval(()=>go(1),1900);document.getElementById('pl').textContent='⏸ 멈춤'};
function sel(k){stop();ex=k;i=0;document.getElementById('t1').classList.toggle('on',k===1);document.getElementById('t2').classList.toggle('on',k===2);build();render()}
document.getElementById('t1').onclick=()=>sel(1);
document.getElementById('t2').onclick=()=>sel(2);
buildCode();
build();render();
</script>
